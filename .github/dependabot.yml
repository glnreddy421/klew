version: 2
updates:
  # Keeps the SHA-pinned actions in .github/workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]

  - package-ecosystem: gomod
    directory: /tools/k8s-log-engine
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /cmd/klew-desktop/frontend
    schedule:
      interval: weekly
