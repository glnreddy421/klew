name: CodeQL

# Static analysis (SAST) for Go and the desktop frontend. Results appear under
# Security → Code scanning and as pull request annotations.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (${{ matrix.language }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS so the Wails desktop app builds and is analyzed too.
          - language: go
            os: macos-latest
            build-mode: manual
          - language: javascript-typescript
            os: ubuntu-latest
            build-mode: none
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - name: Build Go
        if: matrix.language == 'go'
        run: |
          mkdir -p cmd/klew-desktop/frontend/dist
          [ -e cmd/klew-desktop/frontend/dist/index.html ] || echo '<!doctype html>' > cmd/klew-desktop/frontend/dist/index.html
          go build ./...

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:${{ matrix.language }}
