name: Traffic stats

# GitHub keeps repository traffic for only 14 days. Save it daily, together
# with release download counts, to the `traffic-data` branch (kept off main so
# daily data commits don't clutter its history).
#
# Setup: add a repository secret TRAFFIC_TOKEN — a fine-grained personal access
# token for this repository with "Administration: Read-only" permission (the
# traffic API requires it). Without the secret, only downloads and repo stats
# are saved.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: traffic-stats
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push to the traffic-data branch
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check out data branch
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git ls-remote --exit-code --heads "$url" traffic-data >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch traffic-data "$url" data
          else
            mkdir data
            git -C data init --quiet -b traffic-data
            git -C data remote add origin "$url"
          fi

      - name: Collect traffic and downloads
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python3 .github/scripts/collect-traffic.py "${{ github.repository }}" data/stats

      - name: Commit and push
        working-directory: data
        run: |
          # Commits appear under the repository owner's identity (see AGENTS.md).
          git config user.name "glnreddy"
          git config user.email "glnreddy6@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit --quiet -m "Traffic stats $(date -u +%Y-%m-%d)"
          git push --quiet origin traffic-data
